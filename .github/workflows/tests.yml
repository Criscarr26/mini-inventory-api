name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar que la aplicacion importa y genera su OpenAPI
        # Detecta los fallos de arranque (conflictos de version, modelos rotos)
        # aunque las pruebas no toquen ese camino.
        run: python -c "from app.main import app; app.openapi()"

      - name: Pruebas
        run: python -m pytest -q
